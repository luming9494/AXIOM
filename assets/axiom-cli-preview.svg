<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870" width="1440" height="870" role="img" aria-labelledby="title desc">
<title id="title">AXIOM CLI — Future interaction concept</title>
<desc id="desc">A dark terminal application showing an AXIOM research agent, experiment evidence checks, task progress and an artifact panel. Visual mockup, not a running application screenshot.</desc>
<defs>
