<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#122538"/><stop offset="1" stop-color="#0c1a2a"/></linearGradient>
<linearGradient id="accent" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#39c3b1"/><stop offset="1" stop-color="#a2f4d8"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#020b14" flood-opacity=".5"/></filter>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" stroke="#bafaf1" stroke-opacity=".045" fill="none"/></pattern>
</defs>
